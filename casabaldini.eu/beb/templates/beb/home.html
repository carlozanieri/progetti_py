{% extends 'beb/base.html' %}
{% load static %}
{% block title %}casabaldini{% endblock %}


<span class="flex-container" style=" position: absolute; margin-top:10%; margin-left:15%; margin-right:15%; background-color: #2c0404;">
<marquee  direction="right"  width="100%" scrollamount="10" onMouseOver="this.stop()" onMouseOut="this.start()" >
		{% for link in links %}
		
		<a style="width: 100%; color:#fff; font-size: 1.5em; margin-left:2%; margin-top:5%; font-weight: bold;" href="{{link.link}}"> <img  src="{% static 'beb/img/links/'%}{{link.img}}" width={{link.width}} height={{link.height}} alt=""/>&nbsp; {{link.titolo}} </a>
			
		{% endfor %} 
</marquee>
</span>
<body class="flex-container" style="background-image:url({% static 'beb/bg.png'%}); background-repeat:repeat;">
{% block content %}

</span> 
<span class="flex-container" style=" position: absolute; margin-top:1%; margin-left:38%; margin-right:20%; ">
<img  src="{% static 'beb/img/'%}logo.jpg" width="40%" height="40%"  alt=""/>	
</span>
<span class="flex-container" style=" position: absolute; margin-top:10%; margin-left:28%; margin-right:20%; ">

<img  src="{% static 'beb/img/'%}fronte.jpg" width="80%" height="80%"  alt=""/>
</span>
{% endblock content %}

		<a style="width: 100%; color:#fff; font-size: 1.5em; margin-left:2%; margin-top:5%; font-weight: bold;" href="{{link.link}}"> <img  src="{% static 'beb/img/links/'%}{{link.img}}" width={{link.width}} height={{link.height}} alt=""/>&nbsp; {{link.titolo}} </a>
