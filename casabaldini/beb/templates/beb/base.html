<!DOCTYPE html>
{% load static %}
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CasaBaldini{% endblock %}</title>
    <link rel="shortcut icon" href="{% static 'beb/favicon.ico' %}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body style="background-image: url({% static 'beb/bg.png' %}); background-repeat: repeat; min-height: 100vh; display: flex; flex-direction: column;">

    <!-- Navbar / Menu -->
    <header>
        {% include 'beb/AceMenu.html' %}
    </header>

    <!-- Contenuto principale -->
    <main class="flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="mt-auto" style="background-color: #2c0404;">
        {% block footer %}{% endblock %}
    </footer>

    
</body>
</html>
