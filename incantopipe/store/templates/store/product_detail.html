<!-- store/templates/store/product_detail.html -->
{% extends 'base.html' %}

{% block title %}{{ product.name }} - InCantoPipe{% endblock %}

{% block content %}
<div class="row my-5">
    <div class="col-md-6">
        {% if product.image %}
            <img src="{{ product.image.url }}" class="img-fluid rounded shadow" alt="{{ product.name }}">
        {% endif %}
    </div>
    <div class="col-md-6">
        <h1>{{ product.name }}</h1>
        <p class="lead">Pezzo Unico Artigianale</p>
        <p>{{ product.description }}</p>
        <div class="d-flex align-items-center justify-content-between">
            <span class="display-6">€ {{ product.price }}</span>
            <form action="{% url 'cart_add' product.id %}" method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-primary btn-lg">Aggiungi al Carrello</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
