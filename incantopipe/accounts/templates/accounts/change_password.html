<!-- accounts/templates/accounts/change_password.html -->
{% extends 'base.html' %}

{% block title %}Cambia password - InCantoPipe{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-dark text-white text-center">
                <h4 class="mb-0">Cambia password</h4>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">Password attuale</label>
                        {{ form.old_password }}
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Nuova password</label>
                        {{ form.new_password1 }}
                        <small class="text-muted">Minimo 8 caratteri, non può essere solo numerica.</small>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Conferma nuova password</label>
                        {{ form.new_password2 }}
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100">Aggiorna password</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
